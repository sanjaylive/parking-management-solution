# park.2all.co.in — single domain, path-routed:
#   /                 booking website (Next.js :3104)
#   /operator         operator console (Next.js :3101, basePath /operator)
#   /v1, /health      API (NestJS :4100)          /socket.io  live updates (WebSocket)
#   /staff/           staff app (Flutter web, static)
#   /app/             customer app (Flutter web, static)
# Installed by vps-setup.sh to /etc/nginx/sites-available/park2all.conf (server_name substituted).

limit_req_zone $binary_remote_addr zone=p2a_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=p2a_api:10m rate=20r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream p2a_api      { server 127.0.0.1:4100; keepalive 16; }
upstream p2a_operator { server 127.0.0.1:3101; keepalive 8; }
upstream p2a_booking  { server 127.0.0.1:3104; keepalive 8; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:p2a_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # --- API ---
    location /v1/auth/ {
        limit_req zone=p2a_auth burst=10 nodelay;
        proxy_pass http://p2a_api;
    }
    location /v1/ {
        limit_req zone=p2a_api burst=60 nodelay;
        proxy_pass http://p2a_api;
    }
    location = /health { proxy_pass http://p2a_api; }
    location /socket.io/ {
        proxy_pass http://p2a_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # --- Flutter web apps (static, served from the active release) ---
    location /staff/ {
        root /opt/park2all/current/web;
        try_files $uri $uri/ /staff/index.html;
        location ~* /(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ { add_header Cache-Control "no-cache"; }
    }
    location = /staff { return 301 /staff/; }
    location /app/ {
        root /opt/park2all/current/web;
        try_files $uri $uri/ /app/index.html;
        location ~* /(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ { add_header Cache-Control "no-cache"; }
    }
    location = /app { return 301 /app/; }

    # --- Next.js apps ---
    location /operator { proxy_pass http://p2a_operator; }
    location / { proxy_pass http://p2a_booking; }
}
